<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:'IT';font-weight:700;src:url('../../../fonts/inter-tight-latin-700-normal.woff2')}
@font-face{font-family:'IT';font-weight:800;src:url('../../../fonts/inter-tight-latin-800-normal.woff2')}
@font-face{font-family:'IT';font-weight:900;src:url('../../../fonts/inter-tight-latin-900-normal.woff2')}
html,body{margin:0}*{box-sizing:border-box}
body{width:1080px;height:1350px;position:relative;overflow:hidden;background:#152F46;font-family:'IT';color:#fff}
#foto{position:absolute;left:0;top:0;width:1080px;height:800px;background:url(../../../fondos/refineria-macro-02.jpg) center 82%/1700px auto}
#fade{position:absolute;left:0;top:520px;width:1080px;height:300px;background:linear-gradient(180deg,rgba(21,47,70,0) 0%,#152F46 92%)}
#txt{position:absolute;left:64px;right:64px;top:700px;display:flex;flex-direction:column;gap:26px}
h1{margin:0;font-weight:900;font-size:88px;line-height:.98;letter-spacing:-.025em;text-transform:uppercase}
h1 .a{color:#FFC93C}
p{margin:0;font-weight:700;font-size:38px;line-height:1.22;color:#DCE6EF;letter-spacing:-.005em}
#pie{position:absolute;left:64px;right:64px;bottom:52px;display:flex;align-items:center;justify-content:space-between}
#pie img{width:200px}
#pie span{font-size:26px;font-weight:800;color:#C9D6E2}
</style></head><body>
<div id="foto"></div><div id="fade"></div>
<div id="txt" class="chk">
 <h1 class="chk">Pemex perdió <span class="a">$10,795 millones de pesos</span> en 3 meses</h1>
 <p class="chk">Y aun así es buena noticia: en el mismo trimestre de 2025 había perdido $61,242 millones, casi 6 veces más. Su deuda bajó a 77,600 millones de dólares.</p>
</div>
<div id="pie"><img src="../../../brand/logo-horizontal-transparente.png"><span>@elholder_</span></div>
</body></html>
