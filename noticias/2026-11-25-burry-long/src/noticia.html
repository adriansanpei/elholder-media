<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:'IT';font-weight:700;src:url('../../../fonts/inter-tight-latin-700-normal.woff2')}
@font-face{font-family:'IT';font-weight:800;src:url('../../../fonts/inter-tight-latin-800-normal.woff2')}
@font-face{font-family:'IT';font-weight:900;src:url('../../../fonts/inter-tight-latin-900-normal.woff2')}
html,body{margin:0}*{box-sizing:border-box}
body{width:1080px;height:1350px;position:relative;overflow:hidden;background:#152F46;font-family:'IT';color:#fff}
#foto{position:absolute;left:0;top:0;width:1080px;height:700px;background:#03140A;overflow:hidden}
#foto .glow{position:absolute;inset:0;background:radial-gradient(600px 520px at 82% 30%,rgba(57,255,106,.30),transparent 70%)}
#foto .ph{position:absolute;left:0;top:0;height:705px}
#foto .phfade{position:absolute;left:330px;top:0;width:220px;height:700px;background:linear-gradient(90deg,transparent,#03140A)}
#foto .ch{position:absolute;left:500px;top:40px}
#foto .fade{position:absolute;left:0;right:0;bottom:0;height:150px;background:linear-gradient(transparent,#03140A)}
.tagp{position:absolute;font-weight:900;border-radius:14px;padding:8px 20px}
#bar{position:absolute;left:0;top:700px;width:1080px;height:6px;background:#FF3B47}
#pill{position:absolute;left:64px;top:668px;display:flex;height:64px;border-radius:6px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.35)}
#pill .l{display:flex;align-items:center;gap:12px;background:#E5484D;font-weight:900;font-size:26px;letter-spacing:.1em;padding:0 22px}
#pill .l i{width:14px;height:14px;border-radius:50%;background:#fff;display:block;box-shadow:0 0 0 5px rgba(255,255,255,.3)}
#pill .r{display:flex;align-items:center;background:#fff;color:#152F46;font-weight:900;font-size:26px;letter-spacing:.06em;padding:0 22px}
#txt{position:absolute;left:64px;right:64px;top:780px;display:flex;flex-direction:column;gap:26px}
h1{margin:0;font-weight:900;font-size:76px;line-height:.98;letter-spacing:-.025em;text-transform:uppercase}
h1 .a{color:#4FC3F7}
p{margin:0;font-weight:700;font-size:34px;line-height:1.24;color:#DCE6EF}
#pie{position:absolute;left:64px;right:64px;bottom:52px;display:flex;align-items:center;justify-content:space-between}
#pie img{width:200px}#pie span{font-size:24px;font-weight:700;color:#9FB4C7}
</style></head><body>
<div id="foto"><div class="glow"></div>
 <img class="ch" src="chart.svg">
 <img class="ph" src="burry.jpg"><div class="phfade"></div>
 <div class="tagp" style="left:620px;top:440px;font-size:40px;background:#fff;color:#152F46">SHORT NASDAQ ❌</div>
 <div class="tagp" style="left:690px;top:530px;font-size:56px;background:#39FF6A;color:#03140A;box-shadow:0 10px 40px rgba(57,255,106,.55)">LONG ✅</div>
 <div class="fade"></div></div>
<div id="bar"></div>
<div id="pill"><span class="l"><i></i>ÚLTIMA HORA</span><span class="r">MICHAEL BURRY</span></div>
<div id="txt">
 <h1>El de "The Big Short" se voltea: <span class="a">ahora es alcista</span></h1>
 <p>Michael Burry, quien predijo la crisis de 2008, cerró su apuesta en contra del Nasdaq: "mi portafolio está más long y menos short que en mucho tiempo".</p>
</div>
<div id="pie"><img src="../../../brand/logo-horizontal-transparente.png"><span>Vía Bull Theory</span></div>
</body></html>
