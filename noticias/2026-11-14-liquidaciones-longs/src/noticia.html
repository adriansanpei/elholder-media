<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:'IT';font-weight:700;src:url('../../../fonts/inter-tight-latin-700-normal.woff2')}
@font-face{font-family:'IT';font-weight:800;src:url('../../../fonts/inter-tight-latin-800-normal.woff2')}
@font-face{font-family:'IT';font-weight:900;src:url('../../../fonts/inter-tight-latin-900-normal.woff2')}
html,body{margin:0}*{box-sizing:border-box}
body{width:1080px;height:1350px;position:relative;overflow:hidden;background:#152F46;font-family:'IT';color:#fff}
#foto{position:absolute;left:0;top:0;width:1080px;height:700px;background:url(mapa.jpg) center top/cover}
#sh{position:absolute;left:0;top:0;width:1080px;height:170px;background:linear-gradient(180deg,rgba(21,47,70,.55),rgba(21,47,70,0))}
#logo{position:absolute;left:52px;top:44px;width:220px;filter:drop-shadow(0 6px 18px rgba(0,0,0,.45))}
#bar{position:absolute;left:0;top:700px;width:1080px;height:6px;background:#4FC3F7}
#pill{position:absolute;left:64px;top:668px;display:flex;align-items:stretch;height:64px;border-radius:6px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.35)}
#pill .l{display:flex;align-items:center;gap:12px;background:#E5484D;font-weight:900;font-size:26px;letter-spacing:.1em;padding:0 22px}
#pill .l i{width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 0 0 5px rgba(255,255,255,.3)}
#pill .r{display:flex;align-items:center;background:#fff;color:#152F46;font-weight:900;font-size:26px;letter-spacing:.06em;padding:0 22px}
#t{position:absolute;left:64px;right:64px;top:770px}
#big{display:flex;align-items:baseline;gap:18px;line-height:.85}
#big b{font-size:190px;font-weight:900;letter-spacing:-.065em;color:#FF3B47}
#big span{font-size:86px;font-weight:900;letter-spacing:-.04em;color:#FF3B47}
h1{margin:14px 0 0;font-size:62px;font-weight:900;line-height:1;letter-spacing:-.03em;text-transform:uppercase}
h1 em{font-style:normal;color:#4FC3F7}
p{margin:22px 0 0;font-size:34px;font-weight:700;line-height:1.22;color:#DCE6EF}
p b{color:#fff}
#pie{position:absolute;left:64px;right:64px;bottom:48px;display:flex;justify-content:flex-end}
#pie span{font-size:23px;font-weight:700;color:#9FB4C7}
</style></head><body>
<div id="foto"></div><div id="sh"></div>
<img id="logo" src="../../../brand/logo-horizontal-transparente.png">
<div id="bar"></div>
<div id="pill"><span class="l"><i></i>ÚLTIMA HORA</span><span class="r">CRIPTO</span></div>
<div id="t">
  <div id="big"><b>$1.8</b><span>billones</span></div>
  <h1>en longs liquidados<br><em>en solo 24 horas</em></h1>
  <p><b>316,423 traders</b> fueron liquidados y 93% del dinero eran apuestas al alza. La mayor orden: $16M en ETH.</p>
</div>
<div id="pie"><span>Fuentes: CoinGlass, CoinGecko · Gráfica vía Watcher.Guru</span></div>
</body></html>
