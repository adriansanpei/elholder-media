<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:'IT';font-weight:700;src:url('../../../fonts/inter-tight-latin-700-normal.woff2')}
@font-face{font-family:'IT';font-weight:800;src:url('../../../fonts/inter-tight-latin-800-normal.woff2')}
@font-face{font-family:'IT';font-weight:900;src:url('../../../fonts/inter-tight-latin-900-normal.woff2')}
html,body{margin:0}*{box-sizing:border-box}
body{width:1080px;height:1350px;position:relative;overflow:hidden;background:#152F46;font-family:'IT';color:#fff}
#foto{position:absolute;left:0;top:0;width:1080px;height:700px;background:#05070A;overflow:hidden}
#bar{position:absolute;left:0;top:700px;width:1080px;height:6px;background:#FF3B47}
#pill{position:absolute;left:64px;top:668px;display:flex;align-items:stretch;height:64px;border-radius:6px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.35)}
#pill .l{display:flex;align-items:center;gap:12px;background:#E5484D;color:#fff;font-weight:900;font-size:26px;letter-spacing:.1em;padding:0 22px}
#pill .l i{width:14px;height:14px;border-radius:50%;background:#fff;display:block;box-shadow:0 0 0 5px rgba(255,255,255,.3)}
#pill .r{display:flex;align-items:center;background:#fff;color:#152F46;font-weight:900;font-size:26px;letter-spacing:.06em;padding:0 22px}
#txt{position:absolute;left:64px;right:64px;top:780px;display:flex;flex-direction:column;gap:26px}
h1{margin:0;font-weight:900;font-size:80px;line-height:.98;letter-spacing:-.025em;text-transform:uppercase}
h1 .a{color:#FF3B47}
p{margin:0;font-weight:700;font-size:36px;line-height:1.22;color:#DCE6EF}
#pie{position:absolute;left:64px;right:64px;bottom:52px;display:flex;align-items:center;justify-content:space-between}
#pie img{width:200px}
#pie span{font-size:24px;font-weight:700;color:#9FB4C7}

#foto .glow{position:absolute;inset:0;background:radial-gradient(700px 500px at 62% 85%,rgba(255,59,71,.35),transparent 70%)}
#foto img.ch{position:absolute}
#foto .fade{position:absolute;left:0;right:0;bottom:0;height:160px;background:linear-gradient(transparent,#05070A)}
.tagp{position:absolute;font-weight:900;color:#fff;background:#FF3B47;border-radius:14px;padding:8px 18px;box-shadow:0 10px 40px rgba(255,59,71,.6)}
.lbl{position:absolute;display:flex;align-items:center;gap:12px;font-weight:900;font-size:34px;color:#fff;background:rgba(5,7,10,.75);padding:10px 18px;border-radius:14px}
.lbl b{color:#FF5A63}
</style></head><body>
<div id="foto"><div class="glow"></div>
 <img class="ch" src="chart.png" style="left:330px;top:40px;height:660px">
 <img src="btc.png" style="position:absolute;left:60px;top:70px;width:250px;filter:drop-shadow(0 18px 40px rgba(247,147,26,.45))">
 <div class="tagp" style="left:60px;top:360px;font-size:64px">−5%</div>
 <div class="tagp" style="left:60px;top:460px;font-size:44px;background:#fff;color:#152F46;box-shadow:none">$58,818</div>
 <div class="fade"></div></div>
<div id="bar"></div>
<div id="pill"><span class="l"><i></i>ÚLTIMA HORA</span><span class="r">BITCOIN</span></div>
<div id="txt">
 <h1>Bitcoin se desploma por debajo de <span class="a">$59,000</span></h1>
 <p>Toca su nivel más bajo desde julio: cae ~5% en el día y casi 28% en el trimestre, arrastrado por la venta masiva en acciones de IA.</p>
</div>
<div id="pie"><img src="../../../brand/logo-horizontal-transparente.png"><span>Gráfica vía Watcher.Guru · Datos: CoinGecko, CoinDesk</span></div>
</body></html>
