<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:'IT';font-weight:700;src:url('../../../fonts/inter-tight-latin-700-normal.woff2')}
@font-face{font-family:'IT';font-weight:800;src:url('../../../fonts/inter-tight-latin-800-normal.woff2')}
@font-face{font-family:'IT';font-weight:900;src:url('../../../fonts/inter-tight-latin-900-normal.woff2')}
html,body{margin:0}*{box-sizing:border-box}
body{width:1080px;height:1350px;position:relative;overflow:hidden;background:#152F46;font-family:'IT';color:#fff}
#foto{position:absolute;left:0;top:0;width:1080px;height:640px;display:flex}
#foto .h{flex:1;background:url(huang.jpg) center 30%/cover}
#foto .n{flex:1;background:url(nvidia.jpg) center/cover}
#st{position:absolute;right:44px;top:44px;transform:rotate(-5deg);background:#E5484D;color:#fff;font-weight:900;font-size:36px;letter-spacing:.02em;padding:14px 24px;border:4px solid #fff;border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,.45)}
#bar{position:absolute;left:0;top:640px;width:1080px;height:6px;background:#4FC3F7}
#pill{position:absolute;left:64px;top:608px;display:flex;align-items:stretch;height:64px;border-radius:6px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.35)}
#pill .l{display:flex;align-items:center;gap:12px;background:#E5484D;color:#fff;font-weight:900;font-size:26px;letter-spacing:.1em;padding:0 22px}
#pill .l i{width:14px;height:14px;border-radius:50%;background:#fff;display:block;box-shadow:0 0 0 5px rgba(255,255,255,.3)}
#pill .r{display:flex;align-items:center;background:#fff;color:#152F46;font-weight:900;font-size:26px;letter-spacing:.06em;padding:0 22px}
#txt{position:absolute;left:64px;right:64px;top:722px;display:flex;flex-direction:column;gap:26px}
h1{margin:0;font-weight:900;font-size:80px;line-height:.98;letter-spacing:-.025em;text-transform:uppercase}
h1 .a{color:#4FC3F7}
p{margin:0;font-weight:700;font-size:36px;line-height:1.22;color:#DCE6EF}
#pie{position:absolute;left:64px;right:64px;bottom:52px;display:flex;align-items:center;justify-content:space-between}
#pie img{width:200px}
#pie span{font-size:24px;font-weight:700;color:#9FB4C7}
</style></head><body>
<div id="foto"><div class="h"></div><div class="n"></div><div id="st">#BringJensenBack</div></div><div id="bar"></div>
<div id="pill"><span class="l"><i></i>NVIDIA</span><span class="r">$NVDA</span></div>
<div id="txt" class="chk">
 <h1 class="chk">Jensen Huang ya platica <span class="a">regresar como CEO</span> de Nvidia</h1>
 <p class="chk">Elon Musk firmó la carta para traerlo de vuelta. La junta aún investiga y el martes hay reporte de resultados.</p>
</div>
<div id="pie"><img src="../../../brand/logo-horizontal-transparente.png"><span>Fuentes: FT, Reuters, Forbes · Fotos: Nvidia</span></div>
</body></html>
