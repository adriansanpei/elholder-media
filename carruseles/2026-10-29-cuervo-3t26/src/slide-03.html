<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../../../plantilla/base.css"><style>
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);background-size:90px 90px}
.chip{display:inline-block;border:3px solid #FFC93C;color:#FFC93C;border-radius:8px;padding:8px 18px;font-size:26px;font-weight:900;letter-spacing:.12em}
.card{background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.14);border-radius:28px;padding:34px 34px 30px;display:flex;flex-direction:column;gap:8px}
.card .k{font-size:26px;font-weight:800;color:#C9D6E2;letter-spacing:.04em;text-transform:uppercase}
.card .big{font-size:104px;line-height:.9;font-weight:900;letter-spacing:-.05em}
.card .s{font-size:26px;font-weight:700;color:#9FB4C7}
.bar{display:flex;align-items:center;gap:22px}
.bar .lab{width:300px;font-size:34px;font-weight:800;line-height:1.05}
.bar .trk{flex:1;height:54px;background:rgba(255,255,255,.08);border-radius:12px;position:relative}
.bar .fil{position:absolute;right:0;top:0;height:100%;background:#FF8A7A;border-radius:12px}
.bar .val{width:170px;text-align:right;font-size:44px;font-weight:900;letter-spacing:-.03em;color:#FF8A7A}
.num{display:flex;gap:26px;align-items:flex-start;border-top:2px solid rgba(255,255,255,.18);padding-top:22px}
.num b{font-size:60px;line-height:.9;font-weight:900;color:#FFC93C;width:80px;flex:none;letter-spacing:-.04em}
.num p{font-size:40px;line-height:1.08;font-weight:800}
.num p span{color:#C9D6E2;font-weight:700;font-size:30px;display:block;margin-top:6px}
.outline{color:transparent;-webkit-text-stroke:4px #fff}
</style></head><body>
<div class="slide">
  <div class="grid"></div>
  <div class="top"><span></span><span>3 / 7</span></div>
  <div class="arriba" style="gap:14px"><h2 class="t-xl">cayó en <span class="acento">todos</span> los mercados.</h2><p class="t-s">ventas netas por región, 3T26 vs. 3T25.</p></div>
  <div style="position:absolute;left:64px;right:64px;top:520px;display:flex;flex-direction:column;gap:46px">
    <div class="bar"><span class="lab">EE.UU. y Canadá</span><div class="trk"><div class="fil" style="width:58%"></div></div><span class="val">-14.5%</span></div>
    <div class="bar"><span class="lab">México</span><div class="trk"><div class="fil" style="width:37%"></div></div><span class="val">-9.3%</span></div>
    <div class="bar"><span class="lab">resto del mundo</span><div class="trk"><div class="fil" style="width:100%"></div></div><span class="val">-25.1%</span></div>
    <div class="bar" style="margin-top:20px;padding-top:40px;border-top:2px solid rgba(255,255,255,.18)"><span class="lab">marca José Cuervo</span><div class="trk"><div class="fil" style="width:85%;background:#FFC93C"></div></div><span class="val acento">-21.3%</span></div>
  </div>
  <div class="abajo"><p class="t-s" style="font-size:36px">EE.UU. y Canadá son más de la mitad de sus ventas.</p></div>
  <div class="pie"><img src="../../../brand/logo-horizontal-transparente.png" alt="El Holder"><span>reporte 3T26 de Becle · Expansión</span></div>
</div></body></html>
