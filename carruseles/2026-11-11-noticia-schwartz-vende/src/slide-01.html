<!doctype html><html lang="es"><head><meta charset="utf-8"><style>@font-face{font-family:IT;font-weight:700;src:url('../../../fonts/inter-tight-latin-700-normal.woff2')}
@font-face{font-family:IT;font-weight:800;src:url('../../../fonts/inter-tight-latin-800-normal.woff2')}
@font-face{font-family:IT;font-weight:900;src:url('../../../fonts/inter-tight-latin-900-normal.woff2')}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;overflow:hidden;font-family:IT;color:#fff;background:radial-gradient(120% 90% at 15% 0%,#1E3F5E 0%,#152F46 45%,#0F2335 100%);position:relative}
.logo{position:absolute;left:64px;bottom:48px;width:190px}
.src{position:absolute;right:64px;bottom:56px;font-weight:700;font-size:20px;color:#8FA3B7;text-align:right;line-height:1.35}
.top{position:absolute;left:64px;right:64px;top:64px;display:flex;align-items:center;justify-content:space-between}
.pill{display:flex;font-weight:900;font-size:24px;letter-spacing:.08em}.pill b{background:#E5484D;padding:10px 20px;border-radius:8px 0 0 8px}.pill span{background:#fff;color:#152F46;padding:10px 20px;border-radius:0 8px 8px 0}
.rp{background:#000;border-radius:12px;padding:10px 18px;height:62px;display:flex;align-items:center}.rp img{height:40px}
h1{position:absolute;left:64px;right:64px;top:170px;font-weight:900;font-size:70px;line-height:1;letter-spacing:-.035em}
h1 span{color:#4FC3FF}
.hero{position:absolute;left:58px;top:420px;display:flex;align-items:baseline;gap:22px;font-weight:900;letter-spacing:-.05em}
.h0{font-size:116px;color:#fff}.ar{font-size:90px;color:#8FA3B7}.h1{font-size:116px;color:#FF4D6D;text-shadow:0 0 40px rgba(255,77,109,.6)}
.cap{position:absolute;left:64px;top:580px;font-weight:800;font-size:28px;color:#C9D6E2}
.tbl{position:absolute;left:64px;right:64px;top:680px;display:flex;flex-direction:column;gap:34px}
.row{display:flex;align-items:center;gap:22px}
.tk{width:96px;font-weight:900;font-size:40px}
.bars{flex:1;position:relative;height:96px}
.bar{position:absolute;left:0;border-radius:10px}
.b0{top:0;height:44px;width:100%;background:rgba(255,255,255,.14);display:flex;align-items:center;padding-left:18px}
.b0 span{font-weight:900;font-size:28px;color:#fff}
.b1{top:56px;height:40px;background:#FF4D6D;box-shadow:0 0 18px rgba(255,77,109,.7)}
.aft{position:absolute;top:56px;left:calc(var(--w,0%) + 22px);font-weight:900;font-size:30px;color:#FF4D6D;line-height:40px}
.pct{width:200px;text-align:right;font-weight:900;font-size:46px;color:#FF4D6D;letter-spacing:-.03em}
</style></head><body>
<div class="top"><div class="pill"><b>● ÚLTIMA HORA</b><span>XRP</span></div><div class="rp"><img src="ripple.png"></div></div>

</body></html>
