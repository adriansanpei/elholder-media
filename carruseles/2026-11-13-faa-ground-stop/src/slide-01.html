<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../../../plantilla/base.css"><style>:root{--acento:#4FC3F7}

.chip i{width:12px;height:12px;border-radius:50%;background:#fff;display:block}
.card{background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.16);border-radius:26px;padding:28px 32px;display:flex;flex-direction:column;gap:6px}
.card .k{font-size:24px;font-weight:800;color:#C9D6E2;letter-spacing:.05em;text-transform:uppercase}
.card .big{font-size:88px;line-height:.92;font-weight:900;letter-spacing:-.045em}
.card .s{font-size:28px;font-weight:700;color:#C9D6E2;line-height:1.2}

.num b{font-size:56px;line-height:.9;font-weight:900;color:var(--acento);width:76px;flex:none}
.num p{margin:0;font-size:40px;line-height:1.08;font-weight:800}
.num p span{display:block;margin-top:6px;font-size:29px;font-weight:700;color:#C9D6E2}
.rojo{color:#FF4D5A}
.foto{position:absolute;background-size:cover;background-position:center;border-radius:26px;border:3px solid rgba(255,255,255,.18)}
.tl{display:flex;gap:22px;align-items:flex-start}
.tl b{flex:none;width:150px;font-size:30px;font-weight:900;color:var(--acento);letter-spacing:.02em;padding-top:4px}
.tl p{margin:0;font-size:33px;line-height:1.12;font-weight:800;border-left:4px solid rgba(255,255,255,.25);padding-left:22px}
.tl p span{display:block;font-size:25px;font-weight:700;color:#C9D6E2;margin-top:4px}
.cita{font-size:60px;line-height:1.02;font-weight:900;letter-spacing:-.035em}
</style></head><body>
