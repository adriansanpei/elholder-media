<!doctype html><html lang="es"><head><meta charset="utf-8"><style>
@font-face{font-family:IT;font-weight:700;src:url('../../../fonts/inter-tight-latin-700-normal.woff2')}
@font-face{font-family:IT;font-weight:800;src:url('../../../fonts/inter-tight-latin-800-normal.woff2')}
@font-face{font-family:IT;font-weight:900;src:url('../../../fonts/inter-tight-latin-900-normal.woff2')}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;overflow:hidden;font-family:IT;color:#fff;background:radial-gradient(120% 90% at 15% 0%,#1E3F5E 0%,#152F46 45%,#0F2335 100%);position:relative}
.top{position:absolute;left:64px;right:64px;top:56px;font-weight:800;font-size:22px;letter-spacing:.16em;color:#4FC3FF;text-align:center}
.hero{position:absolute;left:64px;right:64px;top:110px;display:flex;align-items:center;gap:34px}
.n{font-weight:900;font-size:250px;line-height:.8;letter-spacing:-.06em;color:#4FC3FF;text-shadow:0 0 40px rgba(79,195,255,.55)}
.h{font-weight:900;font-size:66px;line-height:1;letter-spacing:-.03em}
.h span{color:#4FC3FF}
.grid{position:absolute;left:52px;right:52px;top:385px;display:grid;grid-template-columns:1fr 1fr;column-gap:40px}
.col{border-top:2px solid rgba(255,255,255,.14)}
.r{display:flex;align-items:center;height:80px;border-bottom:2px solid rgba(255,255,255,.1);gap:16px}
.i{width:42px;font-weight:900;font-size:26px;color:#4FC3FF;text-align:right}
.l{width:52px;height:52px;border-radius:12px;overflow:hidden;background:#fff;flex:none}
.l img{width:100%;height:100%;display:block}
.c{flex:1;font-weight:800;font-size:29px;letter-spacing:-.01em;white-space:nowrap}
.s{font-weight:700;font-size:16px;letter-spacing:.1em;color:#9FB4C7;text-align:right;white-space:nowrap}
.pie{position:absolute;left:64px;right:64px;bottom:44px;display:flex;align-items:center;justify-content:space-between}
.pie img{width:190px}.pie span{font-weight:700;font-size:20px;color:#8FA3B7;text-align:right;line-height:1.35}
</style></head><body>
<div class="top">PRE-IPO · STARTUPS DE LATAM CON CAPITAL DE RIESGO</div>
<div class="hero"><div class="n">20</div><div class="h">empresas de LatAm que <span>aún no salen a bolsa</span></div></div>
<div class="grid" id="g"></div>
<div class="pie"><img src="../../../brand/logo-horizontal-transparente.png"><span>Fuente: reportes públicos, lista de Mariano Grosman (oct 2026)<br>Solo informativo. No es asesoría financiera.</span></div>
<script>
const d=[["Rappi","SUPER APP"],["QuintoAndar","INMOBILIARIO"],["Plata","FINTECH"],["Creditas","CRÉDITO"],["Ualá","FINTECH"],["Nuvemshop","E-COMMERCE"],["Wildlife Studios","VIDEOJUEGOS"],["Loft","INMOBILIARIO"],["unico","IDENTIDAD"],["Clip","PAGOS"],["Bitso","CRIPTO"],["Kavak","AUTOS"],["Mercado Bitcoin","CRIPTO"],["CloudWalk","PAGOS"],["QI Tech","INFRA FINTECH"],["Loggi","LOGÍSTICA"],["Dock","INFRA BANCARIA"],["Olist","E-COMMERCE"],["Kushki","PAGOS"],["NotCo","FOOD TECH"]];
const g=document.getElementById('g');
[0,10].forEach(o=>{const c=document.createElement('div');c.className='col';
for(let k=o;k<o+10;k++){const n=String(k+1).padStart(2,'0');c.innerHTML+=`<div class="r"><div class="i">${n}</div><div class="l"><img src="logos/${n}.png"></div><div class="c">${d[k][0]}</div><div class="s">${d[k][1]}</div></div>`}
g.appendChild(c)});
</script></body></html>
