<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:'IT';font-weight:700;src:url('../../../fonts/inter-tight-latin-700-normal.woff2')}
@font-face{font-family:'IT';font-weight:800;src:url('../../../fonts/inter-tight-latin-800-normal.woff2')}
@font-face{font-family:'IT';font-weight:900;src:url('../../../fonts/inter-tight-latin-900-normal.woff2')}
html,body{margin:0}*{box-sizing:border-box}
body{width:2000px;height:800px;position:relative;overflow:hidden;background:#0B1B2A;font-family:'IT';color:#fff}
#foto{position:absolute;inset:0;background:url(bg.jpg) right 78%/auto 150%;background-repeat:no-repeat}
#g{position:absolute;inset:0;background:linear-gradient(90deg,rgba(11,27,42,.97) 0,rgba(11,27,42,.9) 45%,rgba(11,27,42,0) 75%)}
#logo{position:absolute;left:64px;top:60px;width:230px}
#t{position:absolute;left:64px;width:1240px;top:170px}
h1{margin:0;font-weight:900;font-size:150px;line-height:.9;letter-spacing:-.05em}
h1 s{text-decoration:line-through;text-decoration-color:#FF4D6D;text-decoration-thickness:14px}
h2{margin:26px 0 0;font-weight:900;font-size:84px;line-height:.98;letter-spacing:-.04em;color:#4FC3F7}
p{margin:28px 0 0;font-weight:800;font-size:42px;line-height:1.15;color:#DCE6EF;letter-spacing:-.02em;width:1000px;font-size:40px}
#b{position:absolute;right:60px;top:800px;background:#E5484D;border-radius:18px;padding:16px 26px;transform:rotate(-5deg);box-shadow:0 14px 40px rgba(0,0,0,.55);font-weight:900;line-height:1}
#b small{display:block;font-size:24px;letter-spacing:.08em;opacity:.92;margin-bottom:6px}#b b{font-size:54px;letter-spacing:-.03em}
#d{position:absolute;right:64px;bottom:56px;font-size:34px;font-weight:800}#d span{color:#4FC3F7}
</style></head><body>
<div id="foto"></div><div id="g"></div>
<img id="logo" src="../../../brand/logo-horizontal-transparente.png">
<div id="t"><h1>Adiós al <s>efectivo</s></h1><h2>(No es lo que crees)</h2><p>México ya tiene ley para usar menos efectivo. El problema es quién controla tu dinero.</p></div>
<div id="b" style="display:none"><small>LEY DE ECONOMÍA DIGITAL</small><b>Ya es ley</b></div>
<div id="d" style="display:none">Desliza <span>→</span></div>
</body></html>
